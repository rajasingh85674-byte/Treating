name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_API: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"
  ANDROID_NDK_VERSION: "25.1.8937393"
  CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate the project and check all modules
        run: |
          set -euo pipefail
          echo "Files in the repository:"
          find . -path ./.git -prune -o -type f -print | sort | head -n 80
          if [ -f ./buildozer.spec ]; then SPEC="./buildozer.spec"
          else SPEC="$(find . -name buildozer.spec -not -path './.buildozer/*' -not -path './.git/*' | head -n 1)"; fi
          if [ -z "$SPEC" ]; then echo "::error::buildozer.spec not found anywhere in the repository"; exit 1; fi
          PROJ="$(dirname "$SPEC")"
          echo "Project folder: $PROJ"
          # A file uploaded from a phone can look like "mentor.py" on screen but carry a hidden character, a space or
          # capital letters in its real name. Such a file does not match the exact name, so it is matched here by its
          # cleaned-up name (letters, digits, dot, dash and underscore only, lower case) and copied to the exact name.
          ALL_FILES="$(find . -path ./.git -prune -o -path ./.buildozer -prune -o -type f -print)"
          MISSING=""
          for m in main.py ui_hud.py voice_mic.py voice_engine.py agents.py broker.py risk_manager.py mentor.py reply_agent.py; do
            if [ -f "$PROJ/$m" ]; then continue; fi
            FOUND=""
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              base="$(basename "$f")"
              clean="$(printf '%s' "$base" | LC_ALL=C tr -cd 'A-Za-z0-9._-' | tr 'A-Z' 'a-z')"
              if [ "$clean" = "$m" ]; then FOUND="$f"; break; fi
            done <<< "$ALL_FILES"
            if [ -n "$FOUND" ]; then
              echo "$m is stored under a different real name, copying it from: $(printf '%s' "$FOUND" | od -An -c | tr -s ' ' | head -n 3)"
              cp -- "$FOUND" "$PROJ/$m"
            else
              MISSING="$MISSING $m"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These files are missing from the repository:$MISSING . Upload them next to buildozer.spec."
            exit 1
          fi
          for m in main.py ui_hud.py voice_mic.py voice_engine.py agents.py broker.py risk_manager.py mentor.py reply_agent.py; do
            test -s "$PROJ/$m" || { echo "::error::$m is empty"; exit 1; }
          done
          echo "All 9 modules found in $PROJ."
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"

      - name: Safety scan (no secrets in the code)
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          MODULES="main.py ui_hud.py voice_mic.py voice_engine.py agents.py broker.py risk_manager.py mentor.py reply_agent.py"
          # only the app modules are scanned; old leftover files in the repository do not matter
          if grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}' $MODULES buildozer.spec; then
            echo "::error::Something that looks like an API key is in the code. Remove it and revoke that key."
            exit 1
          fi
          if LC_ALL=C grep -nP '[^\x00-\x7F]|\r' $MODULES buildozer.spec; then
            echo "::warning::Non-ASCII or hidden characters found in the lines above. The build continues, but replace those files with the clean ones."
          fi
          echo "Key scan finished."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile check
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python -m py_compile main.py ui_hud.py voice_mic.py voice_engine.py agents.py broker.py risk_manager.py mentor.py reply_agent.py

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache gfortran \
            libdb-dev libgdbm-dev libgdbm-compat-dev tk-dev libsqlite3-dev \
            libbz2-dev liblzma-dev libreadline-dev uuid-dev
          # python-for-android installs its host Python under /usr/local
          sudo chown -R "$(id -un)":"$(id -gn)" /usr/local
          sudo chmod -R u+rwX /usr/local

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/sh\nexec "%s/cmdline-tools/latest/bin/sdkmanager" "$@"\n' "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Buildozer and Cython
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" virtualenv

      - name: Point buildozer.spec at the SDK and NDK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sed -i "s|^android.sdk_path =.*|android.sdk_path = ${ANDROID_HOME}|" buildozer.spec
          sed -i "s|^android.ndk_path =.*|android.ndk_path = ${ANDROID_NDK_HOME}|" buildozer.spec
          grep -nE "^(version|requirements|android\.(api|minapi|ndk|ndk_api|sdk_path|ndk_path|archs|permissions))" buildozer.spec

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect the APK
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$PROJECT_DIR"/bin/*.apk "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Check the APK holds only ARM64 libraries
        run: |
          set -euo pipefail
          APK="$(ls "$GITHUB_WORKSPACE"/out/*.apk | head -n 1)"
          unzip -l "$APK" | grep -E 'lib/(x86|x86_64|armeabi-v7a)/' && { echo "ERROR: wrong CPU libraries in APK"; exit 1; } || true
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' || { echo "ERROR: no arm64-v8a libraries in APK"; exit 1; }
          echo "ARM64 check passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-neural-matrix-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
